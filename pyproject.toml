[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "endireita-pdf"
version = "1.0.0"
description = "API para corrigir inclinacao e melhorar a legibilidade de PDFs digitalizados"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "PyMuPDF>=1.25,<2",
    "opencv-python-headless>=4.11,<5",
    "numpy>=2.2,<3",
    "pytesseract>=0.3.13,<1",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
